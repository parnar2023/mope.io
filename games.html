<!DOCTYPE html>
<html>
<head>
    <title>Games</title>
    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin-top: 30px;
        }
        .game-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
        }
        .game {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .game button {
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
            border: 1px solid black;
            background: white;
            transition: 0.2s;
        }
        .game button:hover {
            background: black;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Select a Game</h1>

    <div class="game-list">

        <div class="game">
            <h3>Mope.io</h3>
            <button onclick="window.location.href='mope.html'">Play</button>
        </div>

        <div class="game">
            <h3>Melon Sandbox</h3>
            <button onclick="window.location.href='melon.html'">Play</button>
        </div>

        <div class="game">
            <h3>Bonk.io</h3>
            <button onclick="window.location.href='bonk.html'">Play</button>
        </div>

        <div class="game">
            <h3>Zombs.io</h3>
            <button onclick="window.location.href='zombs.html'">Play</button>
        </div>

    </div>

</body>
</html>
